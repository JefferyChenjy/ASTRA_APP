name: Build and Deploy RDS Application

on:
  push:
    branches:
      - main
      - feature/initial-setup
    paths:
      - "APP/app/**"
      - ".github/workflows/deploy-rds.yml"

  pull_request:
    branches:
      - main
    paths:
      - "APP/app/**"

permissions:
  contents: read
  id-token: write  # Required for GitHub OIDC authentication to AWS

jobs:
  deploy:
    name: Build, Push & Deploy to ECS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.RDS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            APP/app

          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Deploy to ECS Service & Update Task Environment
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.RDS_ECS_SERVICE }}
          DB_NAME: "astra-mysql-db"
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"